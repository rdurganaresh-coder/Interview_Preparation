services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mastery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  mongodb:
    image: mongo:8.0
    ports:
      - "27017:27017"
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
