server:
  port: 8200
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3003"
              - "http://localhost:3004"
              - "http://localhost:4201"
              - "http://localhost:4202"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: order-service
          uri: http://localhost:8201
          predicates:
            - Path=/orders/**
        - id: payment-service
          uri: http://localhost:8202
          predicates:
            - Path=/payments/**
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
